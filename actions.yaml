openapi: 3.1.0
info:
  title: github-mini
  version: 1.0.0
servers:
  - url: https://api.github.com
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
paths:
  /repos/{owner}/{repo}/contents/{path}:
    get:
      operationId: get_file
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: path; name: owner; required: true; schema: { type: string }
        - in: path; name: repo; required: true; schema: { type: string }
        - in: path; name: path; required: true; schema: { type: string }
        - in: query; name: ref; required: false; schema: { type: string }
      responses:
        "200": { description: OK }
  /repos/{owner}/{repo}/git/blobs:
    post:
      operationId: create_blob
      security: [ { bearerAuth: [] } ]
      requestBody: { required: true; content: { application/json: { schema: { type: object } } } }
      responses:
        "201": { description: Created }
  /repos/{owner}/{repo}/git/trees:
    post:
      operationId: create_tree
      security: [ { bearerAuth: [] } ]
      requestBody: { required: true; content: { application/json: { schema: { type: object } } } }
      responses:
        "201": { description: Created }
  /repos/{owner}/{repo}/git/commits:
    post:
      operationId: create_commit
      security: [ { bearerAuth: [] } ]
      requestBody: { required: true; content: { application/json: { schema: { type: object } } } }
      responses:
        "201": { description: Created }
  /repos/{owner}/{repo}/git/refs:
    post:
      operationId: create_ref
      security: [ { bearerAuth: [] } ]
      requestBody: { required: true; content: { application/json: { schema: { type: object } } } }
      responses:
        "201": { description: Created }
  /repos/{owner}/{repo}/pulls:
    post:
      operationId: create_pr
      security: [ { bearerAuth: [] } ]
      requestBody: { required: true; content: { application/json: { schema: { type: object } } } }
      responses:
        "201": { description: Created }
